<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI 뉴스레터 - AI Newsletter & Intelligence Platform{% endblock %}</title>
    <meta name="description" content="글로벌 및 한국의 최신 AI 프론티어 모델, 자율 에이전트, 반도체 및 규제 동향을 매일 분석 전달하는 AI 전문 인텔리전스 뉴스레터입니다.">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="AI 뉴스레터 & 인텔리전스 플랫폼">
    <meta property="og:description" content="LLM, AI 반도체, 에이전트 및 글로벌 AI 정책 매일 브리핑">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css').path }}?v=20260917-ai">
    <script>
      const savedLang = localStorage.getItem("preferred_lang");
      if (savedLang === "en") {
        document.documentElement.classList.add("lang-en-active");
      }
    </script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="{{ url_for('static', path='app.js').path }}?v=20260917-ai"></script>
  </head>
  <body class="google-anno-skip">
    {% block body %}{% endblock %}
  </body>
</html>
