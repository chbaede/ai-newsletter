<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI 뉴스레터 - AI Newsletter & Intelligence Platform{% endblock %}</title>
    <meta name="description" content="글로벌 및 한국의 최신 AI 프론티어 모델, 자율 에이전트, 반도체 및 규제 동향을 매일 분석 전달하는 AI 전문 인텔리전스 뉴스레터입니다.">
    <meta name="robots" content="index, follow">
    <meta name="google-site-verification" content="2VmKKN5VGVIL9P-KiYywyJoeJQiKVCxEhRM4japgnzE" />
    <meta property="og:title" content="AI 뉴스레터 & 인텔리전스 플랫폼">
    <meta property="og:description" content="LLM, AI 반도체, 에이전트 및 글로벌 AI 정책 매일 브리핑">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css').path }}?v=20260918-nightmode">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6854824605420161" crossorigin="anonymous"></script>
    <script>
      // Load saved language and theme preferences immediately to avoid FOUC
      const savedLang = localStorage.getItem("preferred_lang");
      if (savedLang === "en") {
        document.documentElement.classList.add("lang-en-active");
      }
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="{{ url_for('static', path='app.js').path }}?v=20260918-nightmode"></script>
  </head>
  <body class="google-anno-skip">
    {% block body %}{% endblock %}
  </body>
</html>
