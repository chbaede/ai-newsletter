[project]
name = "ai-newsletter"
version = "0.1.0"
description = "AI Newsletter & Intelligence Platform with bilingual (Korean/English) support, event clustering, and email digest"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "feedparser>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ai-newsletter = "ai_newsletter.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_newsletter*"]

[tool.setuptools.package-data]
ai_newsletter = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

